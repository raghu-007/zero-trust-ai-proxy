services:
  proxy:
    build: .
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - proxy-data:/data
    environment:
      ZT_DATABASE_URL: sqlite:////data/zero_trust.db
      ZT_ALLOWED_HOSTS: localhost,127.0.0.1
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped

volumes:
  proxy-data:
